# Grafana Alloy on the HUB cluster.
#
# Unified telemetry collector. On the hub, Alloy:
#   - Scrapes its own pod metrics and forwards to Prometheus (in-cluster URL)
#   - Tails pod logs and forwards to Loki (in-cluster URL)
#   - Receives OTLP traces from apps and forwards to Tempo (in-cluster URL)
#
# Spoke clusters use a DIFFERENT alloy values file (in eks-observability-iac/
# spoke-alloy-values/<spoke>/alloy-values.yaml) that targets the external
# hub URLs with basic auth.

controller:
  type: daemonset

alloy:
  configMap:
    create: true
    content: |
      // ====================================================================
      // LOGS - scrape pod logs and push to Loki (in-cluster)
      // ====================================================================

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // Skip completed/failed pods
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Pending|Succeeded|Failed|Completed"
          action        = "drop"
        }

        rule { source_labels = ["__meta_kubernetes_namespace"]              target_label = "namespace" }
        rule { source_labels = ["__meta_kubernetes_pod_name"]               target_label = "pod" }
        rule { source_labels = ["__meta_kubernetes_pod_container_name"]     target_label = "container" }
        rule { source_labels = ["__meta_kubernetes_pod_node_name"]          target_label = "node" }
        rule { source_labels = ["__meta_kubernetes_pod_label_app"]          target_label = "app" }
        rule { source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"] target_label = "app" }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        forward_to = [loki.write.default.receiver]
        stage.static_labels {
          values = {
            cluster = "observability-cluster",
          }
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
        }
      }

      // ====================================================================
      // TRACES - OTLP receiver, forward to Tempo (in-cluster)
      // ====================================================================

      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        http { endpoint = "0.0.0.0:4318" }

        output {
          traces  = [otelcol.processor.batch.default.input]
          metrics = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        timeout         = "10s"
        send_batch_size = 1024

        output {
          traces  = [otelcol.processor.attributes.default.input]
          metrics = [otelcol.exporter.prometheus.default.input]
        }
      }

      otelcol.processor.attributes "default" {
        action {
          key    = "cluster"
          value  = "observability-cluster"
          action = "upsert"
        }
        output {
          traces = [otelcol.exporter.otlphttp.tempo.input]
        }
      }

      otelcol.exporter.otlphttp "tempo" {
        client {
          endpoint = "http://tempo.observability.svc.cluster.local:4318"
        }
      }

      otelcol.exporter.prometheus "default" {
        forward_to = [prometheus.remote_write.default.receiver]
      }

      // ====================================================================
      // METRICS - scrape Alloy's own metrics, push to Prometheus (in-cluster)
      // ====================================================================

      prometheus.scrape "alloy" {
        targets = [{ __address__ = "127.0.0.1:12345" }]
        forward_to = [prometheus.remote_write.default.receiver]
        scrape_interval = "60s"
      }

      prometheus.remote_write "default" {
        external_labels = {
          cluster     = "observability-cluster",
          environment = "production",
        }
        endpoint {
          url = "http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write"
        }
      }

  extraPorts:
    - { name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP }
    - { name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP }

  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

  securityContext:
    privileged: true
    runAsUser: 0

  mounts:
    varlog: true
    dockercontainers: true

service:
  enabled: true
  type: ClusterIP

serviceMonitor:
  enabled: true
  interval: 60s
